[project]
name = "pympp"
version = "0.15.0"
description = "Python SDK for the Machine Payments Protocol (MPP)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
authors = [{ name = "Tempo" }]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# tempo
tempo = [
    "pytempo>=0.6.1",
    "eth-account>=0.13",
    "eth-abi>=5.1",
    "rlp>=4.0",
    "cryptography>=43",
]
# evm
evm = [
    "eth-account>=0.13",
    "eth-abi>=5.1",
]
# redis
redis = ["redis>=5.2"]
# asgi
asgi = ["starlette>=0.40"]
# mcp
mcp = ["mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/tempoxyz/pympp"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.0",
    "ruff==0.16.6",
    "pytest-cov>=7.0.0",
    "coverage==7.16.0",
    "pyright==1.1.413",
    "pyproject-hooks==1.2.0",
    "eth-abi>=5.0,<6",
    "build==1.6.0",
    "twine>=6.0",
    "urllib3==2.8.0",
    "redis>=5.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "x402[evm,httpx]>=2.25,<3",
    "fastapi>=0.115",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mpp"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# These modules check their optional dependency group before importing it.
"src/mpp/tempo/__init__.py" = ["E402"]
"src/mpp/mcp_sdk/server.py" = ["E402"]
"src/mpp/mcp_sdk/client.py" = ["E402"]
"src/mpp/server/starlette.py" = ["E402"]
