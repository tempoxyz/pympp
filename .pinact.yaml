version: 3

rules:
  # tempoxyz/gh-actions has no release version to record in a comment.
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "tempoxyz/gh-actions/.*"
  # tempoxyz/changelogs v0.10.0 (tempoxyz/changelogs#188, the `auto-merge`
  # input) is younger than the 7-day cooldown. Allow this exact commit;
  # remove after 2026-11-01. The exception also skips version-comment
  # verification.
  - ignore: true
    conditions:
      - expr: |
          ActionName == "tempoxyz/changelogs" && ActionVersion == "7928d3260c48d9dbe72f9fa4d5fca968cbfa020d"
