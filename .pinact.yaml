version: 3

rules:
  # tempoxyz/gh-actions has no release version to record in a comment.
  - ignore: true
    conditions:
      - expr: |
          ActionName matches "tempoxyz/gh-actions/.*"
  # tempoxyz/changelogs has no release tag with the locked install and
  # publish-only Python tooling fixes yet. Allow this exact 2026-10-21 commit
  # before the 7-day cooldown; remove after 2026-10-28 or once it is tagged.
  # The exception also skips version-comment verification.
  - ignore: true
    conditions:
      - expr: |
          ActionName == "tempoxyz/changelogs" && ActionVersion == "4cdda943b3452daf4f6af3dfc25859e03f7b4a31"
