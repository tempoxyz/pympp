name: Changelog

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Install changelogs
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tempoxyz/changelogs/releases/download/v0.11.0/changelogs-linux-amd64" \
            -o "$HOME/.local/bin/changelogs"
          echo "eefb2decb9dea1e09f8a9a3935d76dfd501a8bbd3b823dd913132bbaf8e1c0dd  $HOME/.local/bin/changelogs" | sha256sum -c
          chmod +x "$HOME/.local/bin/changelogs"
      - name: Generate changelog
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
          CLAUDE: npx -y @anthropic-ai/claude-code@2.1.97 --bare -p
        run: |
          rm -rf .claude/
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          CODE_CHANGES=$(echo "$CHANGED" | grep -vE '^(\.changelog/|\.github/|\.gitignore|README\.md|AGENTS\.md)' || true)
          if [ -z "$CODE_CHANGES" ]; then
            echo "No code changes requiring changelog, skipping"
            exit 0
          fi
          ~/.local/bin/changelogs add --ecosystem python --ai "$CLAUDE" --ref "origin/${BASE_REF}"
      - name: Commit changelog
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$(git status --porcelain .changelog/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}"
            git add .changelog/
            git commit -m "chore: add changelog"
            git push
          fi
