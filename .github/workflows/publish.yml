name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    environment: release
    # The changelog-release version PR, branch, tags, and GitHub releases are
    # created with a short-lived GitHub App token minted via the github-sts
    # action (authorized by .github/sts/release-pr.sts.yaml); the built-in
    # GITHUB_TOKEN is not allowed to create pull requests.
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing (OIDC) and the STS exchange
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
      - name: Fetch GitHub token via STS
        id: app-token
        uses: tempoxyz/gh-actions/actions/github-sts@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          policy: release-pr

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - uses: tempoxyz/changelogs@b810ec2bdffd21f0d14a4709b4b8ab6f75715246 # 2026-10-06T03-24-54Z-b810ec2b # OIDC trusted publishing
        with:
          ecosystem: python
          python-version: '3.12'
          conventional-commit: true
          github-token: ${{ steps.app-token.outputs.token }}
