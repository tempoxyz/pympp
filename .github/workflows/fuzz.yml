name: Fuzz

# Coverage-guided fuzzing of the header parsers, Tempo transaction decoders
# and body digest with atheris (fuzz/). Each target's corpus is cached between
# runs; crashing inputs are uploaded as artifacts.

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "900"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_authorization
          - fuzz_body_digest
          - fuzz_receipt
          - fuzz_tempo_transaction
          - fuzz_www_authenticate
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Seeds come from the cross-SDK conformance vectors, at the commit
      # conformance.yml uses.
      - name: Check out mpp-tools vectors
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: tempoxyz/mpp-tools
          ref: c5dde8faa684b79e2df665143cf7cd731608c079
          path: mpp-tools
          persist-credentials: false
          sparse-checkout: conformance/vectors

      # restore-keys picks up the last corpus; the save below uses a new key
      # every run, even when fuzzing crashed, so the corpus keeps growing.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ inputs.seconds || '900' }}
        run: |
          set -o pipefail
          case "$SECONDS_PER_TARGET" in
            '' | *[!0-9]*) echo "seconds must be a whole number: $SECONDS_PER_TARGET" >&2; exit 1 ;;
          esac
          make fuzz FUZZ_TARGETS="$TARGET" FUZZ_SECONDS="$SECONDS_PER_TARGET" \
            MPP_TOOLS_VECTORS=mpp-tools/conformance/vectors 2>&1 | tee "$RUNNER_TEMP/fuzz.log"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Summarize crash
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "## \`$TARGET\` crashed"
            echo '```'
            sed -n '/=== Uncaught Python exception/,/^Base64:/p' "$RUNNER_TEMP/fuzz.log" | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/crashes/${{ matrix.target }}/
          if-no-files-found: ignore
