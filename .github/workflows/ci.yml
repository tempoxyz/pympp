name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aegis blocks packages published within Socket's cooldown window. The
  # project does not commit a lockfile, so resolve as of a week ago to keep a
  # fresh upstream release from failing every job.
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, test, integration, package, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi

  # Pyright took ~10s inside the 3.12 test job, the longest one; on its own
  # it runs alongside the tests instead.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Add venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Type check
        uses: tempoxyz/gh-actions/vendor/jakebailey/pyright-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: PATH

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          cov_reports=(--cov-report=term-missing)
          if [[ "$PYTHON_VERSION" == "3.12" ]]; then
            cov_reports+=(--cov-report=xml:coverage.xml --cov-report=html:htmlcov)
          fi
          uv run pytest -v --cov=mpp "${cov_reports[@]}" --cov-fail-under=90

      - name: Upload coverage artifacts
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Start the containers in the background so pulling and booting them
      # overlaps the setup below; a later step waits for `up --wait` to finish.
      - name: Start Tempo localnet, Anvil and Redis
        run: (docker compose up -d --wait --quiet-pull > "$RUNNER_TEMP/compose-up.log" 2>&1; echo $? > "$RUNNER_TEMP/compose-up.status") > /dev/null 2>&1 &

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Wait for Tempo localnet, Anvil and Redis
        run: |
          for _ in {1..360}; do [[ -s "$RUNNER_TEMP/compose-up.status" ]] && break; sleep 0.5; done
          cat "$RUNNER_TEMP/compose-up.log"
          [[ "$(cat "$RUNNER_TEMP/compose-up.status" 2>/dev/null)" == 0 ]]

      - name: Run integration tests
        run: |
          # TODO: the rewrite has no localnet tests yet; exit code 5 means none were collected.
          uv run pytest -m "integration or redis or x402_localnet" -v || [ $? -eq 5 ]
        env:
          TEMPO_RPC_URL: http://localhost:8545
          REDIS_URL: redis://localhost:6379
          X402_ANVIL_RPC_URL: http://localhost:18546

      - name: Stop containers
        if: always()
        run: docker compose down

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # `uv build` uses the same hatchling backend as `python -m build` but
      # creates its isolated build environment with uv instead of pip.
      - name: Build and validate package
        run: |
          uv build
          uv run twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: dist/*
          if-no-files-found: error

  # Builds its own wheel rather than waiting on the package job's artifact,
  # so it runs alongside the other jobs.
  install-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        profile: [base, tempo, mcp, evm]

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          # Each profile installs different extras. With a shared key the first
          # job to finish saved its cache and the heavier profiles ran cold.
          cache-suffix: smoke-${{ matrix.profile }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Create clean virtualenv
        run: uv venv .smoke-venv --python 3.12

      - name: Install built wheel
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          WHEEL=$(echo dist/*.whl)
          case "$PROFILE" in
            base)
              INSTALL_TARGET="$WHEEL"
              ;;
            tempo)
              INSTALL_TARGET="${WHEEL}[tempo]"
              ;;
            mcp)
              INSTALL_TARGET="${WHEEL}[mcp]"
              ;;
            evm)
              INSTALL_TARGET="${WHEEL}[evm]"
              ;;
          esac
          uv pip install --python .smoke-venv/bin/python "$INSTALL_TARGET"

      - name: Smoke test built wheel
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          .smoke-venv/bin/python - <<'PY'
          import os
          import mpp, mpp.server, mpp.client
          assert mpp.Challenge and mpp.server.Mpp and mpp.client.Mpp
          profile = os.environ["PROFILE"]
          if profile == "tempo":
              from mpp.tempo import client, server
              assert server.charge and client.secp256k1_account
          elif profile == "evm":
              from mpp.evm import client, server
              assert server.charge and client.charge
          elif profile == "mcp":
              from mpp.mcp_sdk.server import mcp_sdk, paid
              assert mcp_sdk and paid
          PY

