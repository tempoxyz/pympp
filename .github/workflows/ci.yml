name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Aegis blocks packages published within Socket's cooldown window. The
  # project does not commit a lockfile, so resolve as of a week ago to keep a
  # fresh upstream release from failing every job.
  UV_EXCLUDE_NEWER: "7 days"

jobs:
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, test, integration, package, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - env:
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled"
            exit 1
          fi

  # Pyright took ~10s inside the 3.12 test job, the longest one; on its own
  # it runs alongside the tests instead.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Add venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Type check
        uses: tempoxyz/gh-actions/vendor/jakebailey/pyright-action@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          version: PATH

      # api/public-api.txt records every public name and signature, so API
      # changes show up in review. `make api` regenerates it.
      - name: Public API snapshot
        run: uv run python scripts/public_api.py --check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    # Redis-backed store tests run on every Python version.
    services:
      redis:
        image: redis:7.4.8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379
        run: uv run pytest -v --cov=mpp --cov-report=term-missing --cov-fail-under=90

  # The whole suite against the Tempo localnet, Redis and Anvil, so this run
  # measures coverage: branch coverage must not fall below .coverage-baseline,
  # and a pull request's changed lines need 90% coverage.
  integration:
    name: Integration Test and Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # diff-cover compares against the base branch.
          fetch-depth: 0

      # Start the containers in the background so pulling and booting them
      # overlaps the setup below; a later step waits for `up --wait` to finish.
      - name: Start Tempo localnet, Anvil and Redis
        run: (docker compose up -d --wait --quiet-pull > "$RUNNER_TEMP/compose-up.log" 2>&1; echo $? > "$RUNNER_TEMP/compose-up.status") > /dev/null 2>&1 &

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # mppx's x402 server for tests/test_x402_client_mppx.py, run on the
      # runner's preinstalled Node from the fixture's lockfile.
      - name: Install mppx server fixture
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/fixtures/x402/mppx-server

      - name: Wait for Tempo localnet, Anvil and Redis
        run: |
          for _ in {1..360}; do [[ -s "$RUNNER_TEMP/compose-up.status" ]] && break; sleep 0.5; done
          cat "$RUNNER_TEMP/compose-up.log"
          [[ "$(cat "$RUNNER_TEMP/compose-up.status" 2>/dev/null)" == 0 ]]

      - name: Run all tests with coverage
        run: >-
          uv run pytest -v --cov=mpp --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-report=html:htmlcov
        env:
          TEMPO_NETWORK: localnet
          REDIS_URL: redis://localhost:6379
          X402_ANVIL_RPC_URL: http://localhost:18546
          # Fail rather than skip when the mppx server fixture is missing.
          X402_MPPX_SERVER: "1"

      - name: Check branch coverage against the baseline
        run: uv run python scripts/coverage_ratchet.py coverage.json

      - name: Check coverage of changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE_REF" --fail-under=90

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
            htmlcov/
          if-no-files-found: ignore

      - name: Stop containers
        if: always()
        run: docker compose down

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # `uv build` uses the same hatchling backend as `python -m build` but
      # creates its isolated build environment with uv instead of pip.
      - name: Build and validate package
        run: |
          uv build
          uv run twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-dist
          path: dist/*
          if-no-files-found: error

  # Builds its own wheel rather than waiting on the package job's artifact,
  # so it runs alongside the other jobs.
  install-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        profile: [base, tempo, stripe, mcp, evm]

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: tempoxyz/gh-actions/vendor/astral-sh/setup-uv@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          # Each profile installs different extras. With a shared key the first
          # job to finish saved its cache and the heavier profiles ran cold.
          cache-suffix: smoke-${{ matrix.profile }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Create clean virtualenv
        run: uv venv .smoke-venv --python 3.12

      - name: Install built wheel
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          WHEEL=$(echo dist/*.whl)
          case "$PROFILE" in
            base)
              INSTALL_TARGET="$WHEEL"
              ;;
            tempo)
              INSTALL_TARGET="${WHEEL}[tempo]"
              ;;
            stripe)
              INSTALL_TARGET="${WHEEL}[stripe]"
              ;;
            mcp)
              INSTALL_TARGET="${WHEEL}[mcp]"
              ;;
            evm)
              INSTALL_TARGET="${WHEEL}[evm]"
              ;;
          esac
          uv pip install --python .smoke-venv/bin/python "$INSTALL_TARGET"

      - name: Smoke test built wheel (base)
        if: matrix.profile == 'base'
        run: |
          .smoke-venv/bin/python - <<'PY'
          import mpp
          import mpp.extensions.mcp as mcp
          import mpp.methods.evm as evm
          import mpp.methods.tempo as tempo
          import mpp.x402 as x402

          assert tempo.CHAIN_ID == 4217
          assert mcp.CODE_PAYMENT_REQUIRED == -32042
          assert x402.X402_VERSION == 2
          assert evm.BASE_USDC.chain_id == 8453

          for expr, hint in (
              ("tempo.ChargeIntent", "pympp[tempo]"),
              ("mcp.PaymentRequiredError", "pympp[mcp]"),
              ("evm.evm", "pympp[evm]"),
          ):
              try:
                  eval(expr)
              except ImportError as exc:
                  assert hint in str(exc), str(exc)
              else:
                  raise AssertionError(f"{expr} unexpectedly imported in base install")

          print("base install smoke test passed")
          PY

      - name: Smoke test built wheel (Tempo dependencies)
        if: matrix.profile == 'tempo' || matrix.profile == 'stripe'
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          .smoke-venv/bin/python - <<'PY'
          import os
          from mpp.methods.tempo import ChargeIntent, TempoAccount
          if os.environ["PROFILE"] == "stripe":
              from stripe import StripeClient
              from mpp.methods.stripe import create
              from mpp.store import MemoryStore
              payments = create(network_id="bn_test", livemode=False, client=StripeClient("sk_test"), store=MemoryStore(), deposit_addresses={"tempo": "0x" + "1" * 40})
              assert [method.name for method in payments.default_methods()] == ["tempo", "stripe"]
          PY

      - name: Smoke test built wheel (evm)
        if: matrix.profile == 'evm'
        run: |
          .smoke-venv/bin/python - <<'PY'
          from mpp.methods.evm import BASE_USDC, evm
          from mpp.server import Mpp

          method = evm(
              currency=BASE_USDC,
              recipient="0x742d35Cc6634c0532925a3b844bC9e7595F8fE00",
              facilitator="https://facilitator.example.com",
          )
          server = Mpp(methods=method, realm="api.example.com", secret_key="k")
          assert [m.name for m in server.methods] == ["evm"]

          print("evm install smoke test passed")
          PY

      - name: Smoke test built wheel (mcp)
        if: matrix.profile == 'mcp'
        run: |
          .smoke-venv/bin/python - <<'PY'
          from mpp.extensions.mcp import PaymentRequiredError, pay, verify_or_challenge

          assert PaymentRequiredError.__name__ == "PaymentRequiredError"
          assert pay.__name__ == "pay"
          assert verify_or_challenge.__name__ == "verify_or_challenge"

          print("mcp install smoke test passed")
          PY
