name: PR Audit

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  authorize:
    if: github.event.label.name == 'cyclops'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check admin permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          PERM=$(gh api "repos/${REPO}/collaborators/${SENDER}/permission" --jq '.permission')
          if [[ "$PERM" != "admin" ]]; then
            echo "::error::Only admins can trigger pr-audit (got: $PERM)"
            exit 1
          fi

  pr-audit:
    needs: authorize
    permissions:
      contents: read
    uses: tempoxyz/gh-actions/.github/workflows/pr-audit.yml@183a02178c660ce295e9a262edc5857cb7135f06
    secrets:
      EVENTS_KEY: ${{ secrets.EVENTS_KEY }}
      EVENTS_CERT: ${{ secrets.EVENTS_CERT }}
      EVENTS_ARGS: ${{ secrets.EVENTS_ARGS }}
