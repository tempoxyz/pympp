name: Bug report
description: Report something in pympp that is broken.
labels: ['bug']
body:
  - type: checkboxes
    attributes:
      label: Existing issues
      options:
        - label: I searched the [existing issues](https://github.com/tempoxyz/pympp/issues) and this bug is not already reported.
          required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal code or steps that reproduce the bug. You can also link a repository or a branch on your fork.
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      description: Which version of `pympp` are you using?
      placeholder: x.y.z (from pip show pympp)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Python version, installed extras, web framework, OS, and anything else that might matter.
    validations:
      required: false
